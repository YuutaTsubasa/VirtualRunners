[package]
name = "runner-wasm"
version = "0.1.0"
description = "虛擬跑跑樂的網頁版引擎：把跑道與房間包成 WebAssembly，在瀏覽器裡跑"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
runner-core = { path = "../runner-core" }
virtual-room = { git = "https://github.com/YuutaTsubasa/VirtualCore", tag = "v0.6.0" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
