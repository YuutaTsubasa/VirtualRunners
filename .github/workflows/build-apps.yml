# 在 GitHub 上打包虛擬跑跑樂各平台的 App。打包步驟在 VirtualCore 的可重用 workflow（五款共用）：
#   https://github.com/YuutaTsubasa/VirtualCore/blob/main/.github/workflows/build-apps.yml
#   手動：Actions → Build apps → Run workflow（檔案在該次執行的 Artifacts）
#   推 v* 標籤（例如 v0.2.0）：打包完自動附到同名的 Release
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YuutaTsubasa/VirtualCore/.github/workflows/build-apps.yml@v0.6.0
    # Android 簽章用的 ANDROID_KEYSTORE_BASE64 等 secrets
    secrets: inherit
    with:
      app-name: VirtualRunners
      wasm-crate: runner-wasm
      key-alias: runners
      # App 版大廳的分享連結指向網頁版
      web-url: https://yuuta-tsubasa.studio/VirtualRunners/
