# 把網頁版（比賽引擎是 WebAssembly）部署到 GitHub Pages：
# https://yuuta-tsubasa.studio/VirtualRunners/
# 步驟在 VirtualCore 的可重用 workflow（五款共用）：
#   https://github.com/YuutaTsubasa/VirtualCore/blob/main/.github/workflows/pages.yml
#
# 線上房間的配對服務預設用 src/lib/site.js 裡已部署的網址；要換成別的，在 repo 的 Variables
# （Settings → Secrets and variables → Actions → Variables）設 SIGNAL_SERVER。
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    uses: YuutaTsubasa/VirtualCore/.github/workflows/pages.yml@v0.3.0
    with:
      core-crate: runner-core
      wasm-crate: runner-wasm
